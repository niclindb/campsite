<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#020d22" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600&family=League+Spartan:wght@600;700&family=Caveat:wght@600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Campground",
        "name": "Northern Oasis Camping",
        "description": "Dispersed RV and tent sites on 10 acres of maple forest between Marquette and Negaunee, Michigan.",
        "priceRange": "$28 per site per night",
        "petsAllowed": true,
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Negaunee",
          "addressRegion": "MI",
          "addressCountry": "US"
        },
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Campfires", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Wifi", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Showers", "value": false },
          { "@type": "LocationFeatureSpecification", "name": "Potable water", "value": false }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
